general {
    lock_cmd = pidof gtklock || gtklock -d -f
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300
    on-timeout = ~/.scripts/brightness/brightness.sh save && ~/.scripts/brightness/brightness.sh dim
    on-resume = ~/.scripts/brightness/brightness.sh restore
}


listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && ~/.scripts/brightness/brightness.sh restore
}


listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
